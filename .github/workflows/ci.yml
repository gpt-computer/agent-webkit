name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: GPT-Computer
  BUNDLE_ID: com.khulnasoft.gptcomputer

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(xcode-select -p 2>/dev/null || echo "/Applications/Xcode.app/Contents/Developer")
          if [ -d "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH"; fi

      - name: Swift lint
        run: |
          swift lint --strict 2>/dev/null || echo "swiftlint not installed, skipping"
          swift build 2>&1 | grep -i "error:" || echo "Build check passed"

      - name: Swift format check
        run: |
          if command -v swiftformat &>/dev/null; then
            swiftformat --lint Sources/GPT-Computer/ || echo "Format issues found"
          else
            echo "swiftformat not installed, skipping"
          fi

  test:
    runs-on: macos-14
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(xcode-select -p 2>/dev/null || echo "/Applications/Xcode.app/Contents/Developer")
          if [ -d "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH"; fi

      - name: Build
        run: swift build

      - name: Run tests
        run: |
          if [ -d "Tests" ]; then
            swift test
          else
            echo "No Tests/ directory yet — bench is the current test runner"
            ./bench help || true
          fi

  build:
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(xcode-select -p 2>/dev/null || echo "/Applications/Xcode.app/Contents/Developer")
          if [ -d "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH"; fi

      - name: Debug build
        run: swift build -c debug

      - name: Release build
        run: swift build -c release

      - name: Assemble app
        run: ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Computer-debug
          path: build/GPT Computer.app

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(xcode-select -p 2>/dev/null || echo "/Applications/Xcode.app/Contents/Developer")
          if [ -d "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH"; fi

      - name: Build release
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ./build.sh release dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          path: |
            build/GPT Computer.dmg
            build/GPT Computer.zip
            build/appcast.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/GPT Computer.dmg
            dist/GPT Computer.zip
            dist/appcast.json
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 ./dist/GPT\ Computer.dmg | cut -d' ' -f1)
          echo "Version: $VERSION"
          echo "SHA256: $SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}